      function advanceSeason() {
        if(!completedSeason()){toast("Complete all 24 rounds before advancing to the next season.");return;}
        const finalConstructors=standings();
        const finalDrivers=driverStandings();
        const constructorChampion=finalConstructors[0];
        const driverChampion=finalDrivers[0];
        career.seasons.push({
          year:career.seasonYear,
          constructorChampion:{teamId:constructorChampion.teamId,points:constructorChampion.points,wins:constructorChampion.wins},
          driverChampion:{name:driverChampion.name,teamId:driverChampion.teamId,points:driverChampion.points,wins:driverChampion.wins},
          constructors:finalConstructors.map((entry,index)=>({position:index+1,teamId:entry.teamId,points:entry.points,wins:entry.wins})),
          drivers:finalDrivers.map((entry,index)=>({position:index+1,name:entry.name,teamId:entry.teamId,points:entry.points,wins:entry.wins})),
          raceWinners:career.results.map(result=>({round:result.round,raceName:result.raceName,winner:result.winner,winnerTeam:result.winnerTeam}))
        });
        for(const team of teams){
          if(team.id===career.teamId)continue;
          const roster=career.aiTeams[team.id];
          const constructorPosition=finalConstructors.findIndex(entry=>entry.teamId===team.id)+1;
          roster.base=Math.min(96,+(roster.base+(constructorPosition>5?0.8:0.35)).toFixed(1));
          roster.drivers.forEach(driver=>{
            const driverPosition=finalDrivers.findIndex(entry=>entry.name===driver.name)+1;
            if(driverPosition>10)driver.rating=Math.min(98,driver.rating+1);
          });
        }
        career.seasonYear++;
        career.raceIndex=0;
        career.results=[];
        career.weekend=null;
        career.pendingCelebration=null;
        career.constructorStandings=teams.map(team=>({teamId:team.id,points:0,wins:0}));
        career.drivers=career.drivers.map(driver=>({...driver,points:0,wins:0,podiums:0,morale:75,trainingSessions:0}));
        career.driverStandings=freshDriverStandings();
        career.sponsor=createSponsor(myTeam());
        strategy={tyre:"medium",stops:"one",pace:"balanced"};
        selectedReportRound=null;
        selectedLap=1;
        lastResult=null;
        page="overview";
        save();
        render();
        toast(`${career.seasonYear} season is underway. Team development and driver ratings carry over.`);
      }

      function gaussian() {
        const a = Math.max(Math.random(),0.000001);
        const b = Math.random();
        return Math.sqrt(-2*Math.log(a))*Math.cos(2*Math.PI*b);
      }
      function runPractice() {
        const race=nextRace();
        const weekend=career.weekend;
        if(!race||!weekend||weekend.round!==race.round||weekend.grid||weekend.practice>=3)return;
        const practiceNumber=weekend.practice+1;
        const fit=setupFit(race,weekend.setup);
        const setupPenalty=(100-fit)*0.004-weekend.setupConfidence*0.0012;
        const tyrePenalty={soft:-0.23,medium:0,hard:0.13}[weekend.practiceTyre]||0;
        const field=raceField().map(entry=>({
          ...entry,time:0,wear:0,bestTime:Infinity,compound:entry.teamId===career.teamId?weekend.practiceTyre:["soft","medium","hard"][entry.seat]
        }));
        const bestTimes=Object.fromEntries(field.map(entry=>[entry.id,Infinity]));
        const laps=[];
        const lapCount=10;
        for(let lap=1;lap<=lapCount;lap++) {
          const lapTimes={};
          for(const entry of field) {
            const isPlayer=entry.teamId===career.teamId;
            const performance=entry.teamBase*0.68+(entry.rating+(entry.morale-75)*0.05)*0.32+
              (isPlayer?career.upgrades.aero*0.65+career.upgrades.power*0.7:0);
            const compoundPenalty=isPlayer?tyrePenalty:({soft:-0.23,medium:0,hard:0.13}[entry.compound]||0);
            const lapTime=race.lapSeconds+(92-performance)*0.065+compoundPenalty+entry.wear*1.1+
              (isPlayer?setupPenalty:0)+gaussian()*0.16;
            entry.time+=lapTime;
            const wearRate={soft:0.0095,medium:0.0055,hard:0.0038}[entry.compound]||0.0055;
            entry.wear=Math.min(1,entry.wear+wearRate);
            entry.bestTime=Math.min(entry.bestTime,lapTime);
            bestTimes[entry.id]=entry.bestTime;
            lapTimes[entry.id]=+lapTime.toFixed(3);
          }
          const order=[...field].sort((a,b)=>a.time-b.time).map(entry=>entry.id);
          laps.push(makeTimingFrame(race,field,{
            lap,order,metricById:Object.fromEntries(field.map(entry=>[entry.id,entry.time])),
            lapTimes,bestTimes:{...bestTimes},tyres:Object.fromEntries(field.map(entry=>[entry.id,entry.compound])),
            phase:`FP${practiceNumber}`,event:`FP${practiceNumber} · ${lap===lapCount?"Session complete":"Green flag running"}`,condition:"Dry"
          }));
        }
        const playerBest=field.filter(entry=>entry.teamId===career.teamId).reduce((best,entry)=>Math.min(best,entry.bestTime),Infinity);
        const result={
          session:practiceNumber,bestLap:+playerBest.toFixed(3),setupFit:fit,tyre:weekend.practiceTyre,
          field:field.map(entry=>({...entry})),laps,weather:"Dry"
        };
        weekend.practiceResults.push(result);
        weekend.practice=practiceNumber;
        const averageFit=weekend.practiceResults.reduce((sum,session)=>sum+session.setupFit,0)/weekend.practiceResults.length;
        weekend.setupConfidence=Math.min(100,Math.round(averageFit*0.55+weekend.practice*12));
        save();
        startLiveSession({
          kind:"practice",practice:practiceNumber,title:`Free Practice ${practiceNumber}${practiceNumber===2?" · Long runs":""}`,
          race,track:race,field:result.field,laps,weather:"Dry",
          onFinish:()=>{page="race";toast(`FP${practiceNumber} complete · best lap ${formatLapTime(result.bestLap)}.`);}
        });
      }
      function runQualifying() {
        const race=nextRace();
        if (!race || !career.weekend || career.weekend.round!==race.round || career.weekend.grid || career.weekend.practice<3) return;
        const wet=Math.random()<0.14;
        const fit=setupFit(race,career.weekend.setup);
        const setupPenalty=(100-fit)*0.012-career.weekend.setupConfidence*0.004;
        const field=raceField().map(entry=>({...entry,bestTime:Infinity,qualifyingTime:Infinity}));
        const bestTimes=Object.fromEntries(field.map(entry=>[entry.id,Infinity]));
        const eliminated={};
        let active=field;
        const laps=[];
        for(let phaseIndex=0;phaseIndex<3;phaseIndex++) {
          const phase=`Q${phaseIndex+1}`;
          const lapTimes={};
          for(const entry of active) {
            const isPlayer=entry.teamId===career.teamId;
            const upgrades=isPlayer?career.upgrades.aero+career.upgrades.power:0;
            const performance=entry.teamBase*0.72+(entry.rating+(entry.morale-75)*0.05)*0.28+upgrades*1.2;
            const rainPenalty=wet?Math.random()*0.8:0;
            const time=+(race.lapSeconds+(92-performance)*0.045+gaussian()*0.22+rainPenalty+(isPlayer?setupPenalty:0)).toFixed(3);
            bestTimes[entry.id]=Math.min(bestTimes[entry.id],time);
            entry.bestTime=bestTimes[entry.id];
            lapTimes[entry.id]=time;
          }
          const ordered=[...field].sort((a,b)=>bestTimes[a.id]-bestTimes[b.id]);
          const activeOrdered=[...active].sort((a,b)=>bestTimes[a.id]-bestTimes[b.id]);
          const remaining=phaseIndex===0?15:10;
          if(phaseIndex<2)activeOrdered.slice(remaining).forEach(entry=>{eliminated[entry.id]=`OUT ${phase}`;});
          const activeIds=new Set(activeOrdered.map(entry=>entry.id));
          const status=Object.fromEntries(ordered.map(entry=>[entry.id,eliminated[entry.id]||(activeIds.has(entry.id)?phase:"")]));
          laps.push(makeTimingFrame(race,field,{
            lap:phaseIndex+1,phase,order:ordered.map(entry=>entry.id),metricById:{...bestTimes},
            lapTimes,bestTimes:{...bestTimes},status,event:`${phase} · ${phaseIndex===2?"pole position decided":`${remaining} drivers advance`}`,
            condition:wet?"Light rain":"Dry"
          }));
          active=activeOrdered.slice(0,remaining);
        }
        const grid=[...field].sort((a,b)=>bestTimes[a.id]-bestTimes[b.id]).map(entry=>({...entry,qualifyingTime:+bestTimes[entry.id].toFixed(3)}));
        grid.forEach((entry,index)=>{
          entry.qualifyingPosition=index+1;
          entry.qualifyingPhase=index<10?"Q3":index<15?"Q2":"Q1";
        });
        career.weekend.weather=wet?"Light rain":"Dry";
        career.weekend.grid=grid;
        career.weekend.qualifyingResults={field:grid,laps,weather:career.weekend.weather};
        save();
        startLiveSession({
          kind:"qualifying",title:"Qualifying · Q1 / Q2 / Q3",race,track:race,field:grid,laps,weather:career.weekend.weather,
          onFinish:()=>{page="race";toast(`Qualifying complete · ${grid[0].name} takes pole.`);}
        });
      }
      function simulateRace() {
        if (completedSeason() || !career.weekend || !career.weekend.grid) return;
        const race = nextRace();
        const setupMatch=setupFit(race,career.weekend.setup);
        const setupPacePenalty=(100-setupMatch)*0.004-career.weekend.setupConfidence*0.0012;
        const field=career.weekend.grid.map(entry=>{
          const isPlayer=entry.teamId===career.teamId;
          const stops=isPlayer?(strategy.stops==="two"?2:1):(Math.random()<0.25?2:1);
          const firstStop=stops===1?Math.round(race.laps*0.52):Math.round(race.laps*0.34);
          const pitLaps=stops===1?[firstStop]:[firstStop,Math.round(race.laps*0.68)];
          return {...entry,time:entry.qualifyingPosition*0.25,wear:0,retired:false,retirementLap:null,stops,pitLaps,pitIndex:0,pitCount:0,
            compound:isPlayer?strategy.tyre:["soft","medium","hard"][Math.floor(Math.random()*3)],bestLap:Infinity,bestLapNumber:0,drsPasses:0};
        });
        const rainLap=Math.random()<0.22?Math.max(3,Math.floor(race.laps*(0.2+Math.random()*0.58))):0;
        const safetyCarLap=Math.random()<0.25?Math.max(3,Math.floor(race.laps*(0.18+Math.random()*0.62))):0;
        let safetyCarRemaining=0;
        let safetyCars=0;
        let wet=false;
        let pitStopCount=0;
        let fastestLap={time:Infinity,name:"",lap:0};
        let previousOrder=field.map(entry=>entry.id);
        const laps=[];
        for(let lap=1;lap<=race.laps;lap++){
          const events=[];
          const lapTimes={};
          if(rainLap===lap){wet=true;events.push("Rain begins · track is damp");}
          if(safetyCarLap===lap){safetyCarRemaining=2;safetyCars++;events.push("Safety car deployed");}
          else if(safetyCarRemaining===1){events.push("Safety car in · racing resumes");}
          const underSafetyCar=safetyCarRemaining>0;
          const runningBefore=[...field].filter(entry=>!entry.retired).sort((a,b)=>a.time-b.time);
          const drsTargets=new Set();
          for(const entry of field){
            if(entry.retired) continue;
            const isPlayer=entry.teamId===career.teamId;
            const pitDue=entry.pitIndex<entry.pitLaps.length&&lap===entry.pitLaps[entry.pitIndex];
            const runningPosition=runningBefore.findIndex(runner=>runner.id===entry.id);
            const carAhead=runningBefore[runningPosition-1];
            const drsActive=!underSafetyCar&&carAhead&&entry.time-carAhead.time<1;
            if(drsActive){drsTargets.add(entry.id);entry.drsPasses++;}
            let pitLoss=0;
            if(pitDue){
              entry.pitCount++;
              pitStopCount++;
              entry.pitIndex++;
              entry.wear=0;
              if(isPlayer){
                pitLoss=(underSafetyCar?14.1:21.4)-career.upgrades.operations*0.45;
                entry.compound=wet?"intermediate":strategy.stops==="two"&&entry.pitCount===1?"soft":"medium";
              }else{
                pitLoss=(underSafetyCar?14.1:21.5)+Math.random()*1.4;
                entry.compound=wet?"intermediate":["medium","hard","soft"][Math.floor(Math.random()*3)];
              }
              events.push(`${entry.name} pits`);
            }
            const tyrePenalty={soft:-0.23,medium:0,hard:0.13,intermediate:wet?-0.25:2.1,wet:wet?-0.55:4.2}[entry.compound]||0;
            const wearRate={soft:0.0095,medium:0.0055,hard:0.0038,intermediate:0.006,wet:0.005}[entry.compound]||0.0055;
            const performance=entry.teamBase*0.68+entry.rating*0.32+(isPlayer?career.upgrades.aero*0.65+career.upgrades.power*0.7:0);
            const paceOffset=isPlayer&&strategy.pace==="push"?-0.18:isPlayer&&strategy.pace==="conserve"?0.2:0;
            const moraleOffset=isPlayer?(75-entry.morale)*0.003:0;
            const rainMismatch=wet&&!["intermediate","wet"].includes(entry.compound)?1.35:0;
            const speedGap=(92-performance)*0.065*(underSafetyCar?0.15:1);
            const scPace=underSafetyCar?race.lapSeconds*0.19:0;
            const lapTime=race.lapSeconds+speedGap+tyrePenalty+rainMismatch+entry.wear*1.1+paceOffset+moraleOffset+(isPlayer?setupPacePenalty:0)+(drsActive?-0.12:0)+scPace+gaussian()*0.16+pitLoss;
            entry.time+=lapTime;
            lapTimes[entry.id]=+lapTime.toFixed(3);
            if(!pitDue&&!underSafetyCar&&lapTime<entry.bestLap){entry.bestLap=lapTime;entry.bestLapNumber=lap;}
            entry.wear=Math.min(1,entry.wear+wearRate*(isPlayer&&strategy.pace==="push"?1.2:1));
            const failureChance=isPlayer&&strategy.pace==="push"?0.0005:0.0002;
            if(Math.random()<failureChance){entry.retired=true;entry.retirementLap=lap;events.push(`${entry.name} retires · mechanical issue`);}
          }
          const ordered=[...field].sort((a,b)=>(a.retired?1:0)-(b.retired?1:0)||a.time-b.time);
          const order=ordered.map(entry=>entry.id);
          const positionById=new Map(order.map((id,index)=>[id,index+1]));
          const playerPositions=career.drivers.map((_,seat)=>{
            const driver=field.find(entry=>entry.teamId===career.teamId&&entry.seat===seat);
            return driver&&!driver.retired?positionById.get(driver.id):"DNF";
          });
          const moved=ordered.find(entry=>{
            const oldPosition=previousOrder.indexOf(entry.id)+1;
            const newPosition=positionById.get(entry.id);
            return oldPosition>newPosition&&oldPosition-newPosition>=1&&!entry.retired;
          });
          if(moved){
            events.push(`${drsTargets.has(moved.id)?"DRS overtake":"On-track pass"} · ${moved.name} gains a place`);
          }
          if(underSafetyCar) safetyCarRemaining--;
          if(!events.length) events.push("Green flag racing");
          const event=events.slice(0,3).join(" · ");
          const status=Object.fromEntries(field.map(entry=>[entry.id,entry.retired?"DNF":""]));
          laps.push({
            ...makeTimingFrame(race,field,{
              lap,phase:"RACE",order,metricById:Object.fromEntries(field.map(entry=>[entry.id,entry.time])),
              lapTimes,bestTimes:Object.fromEntries(field.map(entry=>[entry.id,Number.isFinite(entry.bestLap)?+entry.bestLap.toFixed(3):null])),
              tyres:Object.fromEntries(field.map(entry=>[entry.id,entry.compound])),status,event,
              condition:wet?"Damp":"Dry",safetyCar:underSafetyCar
            }),
            playerPositions
          });
          previousOrder=order;
        }
        function completeRace(completed) {
        const finishers=field.filter(entry=>!entry.retired).sort((a,b)=>a.time-b.time);
        const classification=[...finishers,...field.filter(entry=>entry.retired)].map((entry,index)=>({id:entry.id,position:entry.retired?null:index+1}));
        const positionsByTeam={};
        const racePoints = {};
        finishers.forEach((entry,index)=>{
          const awarded=index<points.length?points[index]:0;
          racePoints[entry.id]=awarded;
          const standing=career.driverStandings.find(driver=>driver.name===entry.name);
          if(standing){standing.points+=awarded;if(index===0)standing.wins++;}
          if(entry.teamId===career.teamId){
            const driver=career.drivers[entry.seat];
            driver.points+=awarded;
            if(index===0)driver.wins++;
            if(index<3)driver.podiums++;
          }
        });
        for (const team of teams) {
          const teamEntries=field.filter(entry=>entry.teamId===team.id);
          const sum=teamEntries.reduce((n,entry)=>n+(racePoints[entry.id]||0),0);
          const row=career.constructorStandings.find(s=>s.teamId===team.id);
          row.points+=sum;
          if(finishers[0]&&finishers[0].teamId===team.id)row.wins++;
          const teamPositions=teamEntries.map(entry=>classification.find(row=>row.id===entry.id).position||20);
          positionsByTeam[team.id]=Math.min(...teamPositions);
        }
        const winner=finishers[0];
        const playerPlace=positionsByTeam[career.teamId];
        const playerDrivers=career.drivers.map((d,i)=>{
          const e=field.find(entry=>entry.teamId===career.teamId&&entry.seat===i);
          return {name:d.name,position:e&&!e.retired?classification.find(row=>row.id===e.id).position:null};
        });
        playerDrivers.forEach((result,index)=>{
          const driver=career.drivers[index];
          const moraleChange=!result.position?-4:result.position<=3?4:result.position<=10?2:-1;
          driver.morale=Math.max(50,Math.min(100,driver.morale+moraleChange));
        });
        const prize=1.5;
        const racePointsEarned=playerDrivers.reduce((sum,driver)=>sum+(driver.position&&driver.position<=points.length?points[driver.position-1]:0),0);
        const weekendBonus=playerPlace<=3?2.5:playerPlace<=10?1.2:0;
        const operationCost=career.upgrades.operations*0.15;
        const sponsorInstallment=career.sponsor.installment;
        career.money=+(career.money+prize+racePointsEarned*0.25+weekendBonus+sponsorInstallment-operationCost).toFixed(1);
        let sponsorBonus=0;
        if(!career.sponsor.paid&&teamPoints(career.teamId)>=career.sponsor.targetPoints){
          sponsorBonus=career.sponsor.reward;
          career.money=+(career.money+sponsorBonus).toFixed(1);
          career.sponsor.paid=true;
        }
        const summary=playerDrivers.map(d=>`${d.name.split(" ").slice(-1)[0]} ${d.position?`P${d.position}`:"DNF"}`).join(" · ");
        for(const entry of field){if(entry.bestLap<fastestLap.time)fastestLap={name:entry.name,lap:entry.bestLapNumber,time:+entry.bestLap.toFixed(3)};}
        const result={
          round:race.round,raceName:race.name,winner:winner?winner.name:"No classified winner",winnerTeam:winner?winner.teamId:"",
          positions:positionsByTeam,summary,weather:rainLap?`Rain on lap ${rainLap}`:"Dry race",safetyCars,pitStops:pitStopCount+completed.extraPitStops,
          retirements:field.filter(entry=>entry.retired).length,fastestLap,field:career.weekend.grid.map(entry=>({...entry})),laps,classification,
          playerDrivers:career.drivers.map(driver=>driver.name),
          setupFit:setupMatch,setupConfidence:career.weekend.setupConfidence,sponsorInstallment,sponsorBonus,
          strategy:{tyre:strategy.tyre,stops:strategy.stops,pace:strategy.pace},
          track:{circuit:race.circuit,location:race.location,laps:race.laps,layout:race.layout,viewBox:race.viewBox,layoutId:race.layoutId}
        };
        career.results.push(result);
        career.raceIndex++;
        if(completedSeason()){
          const constructorChampion=standings()[0];
          const driverChampion=driverStandings()[0];
          const constructorWon=constructorChampion.teamId===career.teamId;
          const driverWon=career.drivers.some(driver=>driver.name===driverChampion.name);
          if(constructorWon||driverWon){
            career.pendingCelebration={
              year:career.seasonYear,constructorWon,driverWon,
              constructorName:getTeam(constructorChampion.teamId).name,constructorPoints:constructorChampion.points,
              driverName:driverChampion.name,driverPoints:driverChampion.points
            };
          }
        }
        career.weekend=null;
        lastResult={weather:result.weather,drivers:playerDrivers};
        selectedReportRound=race.round;
        selectedLap=1;
        save();
        return result;
        }
        startLiveSession({
          kind:"race",title:`${race.name} · Live race`,race,track:race,field,laps,weather:rainLap?`Rain on lap ${rainLap}`:"Dry race",
          onFinish:completed=>{const result=completeRace(completed);page="report";toast(`${race.name} complete · ${result.winner} wins.`);}
        });
      }

      render();
    })();
  </script>
  <script type="module" src="/src/firebase-auth.js"></script>
</body>
</html>
