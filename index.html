<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111214">
  <title>APEX — Formula One Team Manager</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');

    :root {
      color-scheme: dark;
      --bg: #111214;
      --panel: #191a1d;
      --panel-hi: #202125;
      --line: #2b2c30;
      --text: #f3f1ed;
      --muted: #8d8e93;
      --red: #ef423a;
      --green: #83d6a5;
      --amber: #e7b65e;
      --display: "Space Grotesk", "Arial Narrow", sans-serif;
      --body: "DM Sans", Arial, sans-serif;
      --mono: "DM Mono", Consolas, monospace;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 260px;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 var(--body);
    }
    button, select { font: inherit; }
    button { color: inherit; }
    .shell { min-height: 100vh; }
    .topbar {
      height: 66px;
      padding: 0 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      background: rgba(17,18,20,.96);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      width: 30px; height: 30px; display: grid; place-items: center;
      background: var(--red); color: white; font: 700 15px var(--display);
      transform: skew(-9deg);
    }
    .brand-name { font: 700 17px var(--display); letter-spacing: .14em; }
    .brand-name span { color: var(--red); }
    .season-tag, .eyebrow {
      color: var(--muted); font: 10px var(--mono); letter-spacing: .12em;
      text-transform: uppercase;
    }
    .top-right { display: flex; align-items: center; gap: 25px; }
    .status { display: flex; align-items: center; gap: 8px; color: #b6b7ba; font-size: 12px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px #83d6a555; }
    .top-round { color: var(--muted); font: 11px var(--mono); }

    .layout { display: grid; grid-template-columns: 220px minmax(0,1fr); min-height: calc(100vh - 66px); }
    .sidebar { border-right: 1px solid var(--line); padding: 25px 14px; display: flex; flex-direction: column; }
    .team-mini { padding: 15px 13px 18px; border: 1px solid var(--line); border-radius: 5px; margin-bottom: 28px; }
    .team-swatch { width: 29px; height: 4px; background: var(--team, var(--red)); margin-bottom: 12px; }
    .team-mini-name { font: 600 14px var(--display); }
    .team-mini-sub { color: var(--muted); font-size: 11px; margin-top: 3px; }
    .nav-label { color: #65666a; font: 9px var(--mono); letter-spacing: .14em; padding: 0 12px 10px; }
    .nav-list { display: grid; gap: 4px; }
    .nav-btn {
      background: transparent; border: 0; border-radius: 4px; padding: 10px 12px;
      display: flex; align-items: center; gap: 12px; color: #9c9da1; text-align: left;
      font-size: 12px; cursor: pointer; transition: background .15s, color .15s;
    }
    .nav-btn:hover { background: #ffffff09; color: var(--text); }
    .nav-btn.active { color: white; background: #ffffff0d; box-shadow: inset 2px 0 var(--red); }
    .nav-icon { width: 16px; text-align: center; color: #75767a; font-size: 14px; }
    .nav-btn.active .nav-icon { color: var(--red); }
    .sidebar-bottom { margin-top: auto; padding: 15px 12px 0; border-top: 1px solid var(--line); }
    .money-label { color: var(--muted); font: 9px var(--mono); letter-spacing: .1em; }
    .money-value { margin-top: 4px; font: 600 19px var(--display); }
    .money-note { color: #737479; font-size: 10px; margin-top: 2px; }

    main { min-width: 0; max-width: 1450px; width: 100%; margin: 0 auto; padding: 32px 38px 55px; }
    .page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 24px; }
    h1 { font: 600 clamp(25px,3vw,34px)/1.1 var(--display); letter-spacing: -.04em; margin: 7px 0 0; }
    .page-sub { color: var(--muted); font-size: 12px; margin-top: 7px; }
    .round-pill { border: 1px solid var(--line); border-radius: 3px; padding: 7px 11px; color: #a4a5a9; font: 10px var(--mono); }
    .grid { display: grid; gap: 14px; }
    .stat-grid { grid-template-columns: repeat(4,minmax(0,1fr)); margin-bottom: 15px; }
    .card { border: 1px solid var(--line); border-radius: 5px; background: var(--panel); }
    .stat-card { padding: 16px 17px; min-height: 100px; }
    .stat-label { color: var(--muted); font: 9px var(--mono); letter-spacing: .1em; text-transform: uppercase; }
    .stat-value { font: 600 24px/1.2 var(--display); margin-top: 9px; }
    .stat-note { color: #74757a; font-size: 10px; margin-top: 3px; }
    .two-col { grid-template-columns: minmax(0,1.58fr) minmax(260px,1fr); }
    .section-card { padding: 19px; }
    .section-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 17px; }
    .section-title { font: 600 14px var(--display); }
    .section-link { color: var(--red); background: transparent; border: 0; font-size: 10px; cursor: pointer; }
    .race-hero {
      position: relative; overflow: hidden; min-height: 212px; padding: 22px;
      display: flex; flex-direction: column; justify-content: space-between;
      background: linear-gradient(115deg,#222326 0%,#1b1c1f 65%,#30211f 100%);
    }
    .race-hero:after {
      content: ""; position: absolute; width: 280px; height: 160px; right: 3%; bottom: -28px;
      border: 2px solid #ef423a3a; border-radius: 48% 52% 38% 62%; transform: rotate(-24deg);
      box-shadow: 0 0 0 11px #ef423a0d, 0 0 0 23px #ef423a09;
    }
    .race-top,.race-bottom { position: relative; z-index: 1; }
    .race-round { color: #aaa; font: 9px var(--mono); letter-spacing: .13em; }
    .race-name { font: 600 25px var(--display); margin-top: 5px; letter-spacing: -.03em; }
    .race-loc { color: #a0a0a3; font-size: 11px; margin-top: 2px; }
    .race-bottom { display: flex; justify-content: space-between; align-items: end; gap: 12px; }
    .race-date { color: #b6b6b8; font: 10px var(--mono); }
    .btn-primary,.btn-secondary,.btn-small {
      border: 0; border-radius: 3px; font: 600 11px var(--body); cursor: pointer;
      transition: transform .12s, background .15s;
    }
    .btn-primary { background: var(--red); color: white; padding: 10px 15px; }
    .btn-primary:hover { background: #ff554d; transform: translateY(-1px); }
    .btn-secondary { background: #2a2b2f; color: #ddd; border: 1px solid #3a3b40; padding: 9px 13px; }
    .btn-secondary:hover { background: #35363a; }
    .btn-small { padding: 6px 9px; background: #292a2e; color: #d3d3d5; border: 1px solid #3a3b40; font-size: 10px; }
    button:disabled { opacity: .48; cursor: not-allowed; transform: none; }
    .drivers-list { display: grid; }
    .driver-row { display: grid; grid-template-columns: 35px minmax(0,1fr) auto; align-items: center; gap: 10px; padding: 11px 0; border-top: 1px solid #292a2d; }
    .driver-row:first-child { border-top: 0; padding-top: 1px; }
    .driver-number { color: #6f7075; font: 10px var(--mono); }
    .driver-name { font: 600 12px var(--display); }
    .driver-sub { color: var(--muted); font-size: 10px; margin-top: 2px; }
    .rating { font: 10px var(--mono); color: var(--green); }
    .table { width: 100%; border-collapse: collapse; }
    .table th { color: #74757a; text-align: left; font: 9px var(--mono); letter-spacing: .09em; padding: 0 9px 10px; }
    .table td { border-top: 1px solid #292a2d; padding: 10px 9px; font-size: 11px; }
    .table th:first-child,.table td:first-child { padding-left: 2px; }
    .table td:last-child,.table th:last-child { text-align: right; }
    .rank { color: #77787d; font: 10px var(--mono); width: 26px; }
    .team-cell { font-weight: 600; }
    .muted { color: var(--muted); }
    .points { font: 11px var(--mono); }
    .result-banner { padding: 10px 12px; background: #25352a; border: 1px solid #35513f; color: #a5dfb6; border-radius: 3px; font-size: 11px; margin-bottom: 14px; }
    .result-banner:empty { display: none; }
    .race-control { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .session-grid { grid-template-columns: minmax(0,1.3fr) minmax(250px,1fr); }
    .market-grid { grid-template-columns: repeat(3,minmax(0,1fr)); }
    .market-card { padding: 17px; display: flex; flex-direction: column; min-height: 191px; }
    .market-card h3 { font: 600 16px var(--display); margin: 4px 0 2px; }
    .market-role { color: var(--muted); font-size: 10px; min-height: 28px; }
    .market-rating { display: flex; align-items: center; gap: 7px; color: var(--green); font: 10px var(--mono); margin-top: 11px; }
    .market-bottom { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: auto; padding-top: 13px; }
    .market-fee { color: #c6c6c9; font: 10px var(--mono); }
    .market-controls { display: flex; align-items: center; gap: 9px; }
    .market-controls select { width: auto; min-width: 180px; }
    .session-card { padding: 18px; }
    .setup-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px 15px; }
    .setup-slider label { display: flex; justify-content: space-between; gap: 8px; color: #c3c4c6; font-size: 10px; }
    .setup-slider output { color: var(--team,var(--red)); font: 10px var(--mono); }
    .setup-slider input { display: block; width: 100%; margin: 7px 0 0; accent-color: var(--team,var(--red)); }
    .setup-feedback { margin-top: 13px; padding: 10px 11px; border: 1px solid #303135; border-radius: 3px; color: #aaa; font-size: 10px; }
    .practice-result { display: flex; justify-content: space-between; gap: 9px; border-top: 1px solid #292a2d; padding: 8px 0; font-size: 10px; }
    .practice-result:first-child { border-top: 0; }
    .practice-result strong { color: #d7d7d8; font: 10px var(--mono); }
    .session-status { color: #75767a; font: 9px var(--mono); }
    .session-status.done { color: var(--green); }
    .session-status.next { color: var(--amber); }
    .practice-replay { margin-left: 6px; padding: 3px 5px; font-size: 7px; }
    .sponsor-card { margin-top: 14px; padding: 18px; }
    .sponsor-progress { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 10px; margin-top: 13px; }
    .sponsor-progress .progress { margin: 0; }
    .sponsor-total { color: #c9cacc; font: 10px var(--mono); white-space: nowrap; }
    .driver-training { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
    .training-note { color: var(--muted); font-size: 9px; }
    .session-badge { border: 1px solid #3b3c40; border-radius: 3px; padding: 6px 9px; color: #b6b7ba; font: 9px var(--mono); white-space: nowrap; }
    .qualifying-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
    .qualifying-row { display: grid; grid-template-columns: 25px minmax(0,1fr) 34px 54px; align-items: center; gap: 7px; border-top: 1px solid #292a2d; padding: 7px 2px; }
    .qualifying-position { color: #77787d; font: 10px var(--mono); }
    .qualifying-driver { font: 600 10px var(--display); }
    .qualifying-team { color: var(--muted); font-size: 9px; }
    .qualifying-time { text-align: right; color: #c3c4c6; font: 9px var(--mono); }
    .track-card { overflow: hidden; }
    .track-head { padding: 17px 18px 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .track-wrap { padding: 10px 12px 0; background: radial-gradient(ellipse at 50% 45%,#202226,#17181b 72%); }
    .track-svg { display: block; width: 100%; max-height: 340px; }
    .track-glow { fill: none; stroke: var(--team,var(--red)); stroke-width: 27; opacity: .14; stroke-linecap: round; stroke-linejoin: round; }
    .track-edge { fill: none; stroke: #e8e9eb; stroke-width: 21; stroke-linecap: round; stroke-linejoin: round; }
    .track-line { fill: none; stroke: #242529; stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; }
    .track-center { fill: none; stroke: #686a6e; stroke-width: 1; stroke-dasharray: 4 5; stroke-linecap: round; stroke-linejoin: round; }
    .track-start { fill: none; stroke: var(--red); stroke-width: 3; }
    .track-car-marker { transition: none; }
    .track-car-body { stroke: #111214; stroke-width: 1.1; }
    .track-number { fill: white; font: 700 4px var(--mono); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .track-legend { padding: 0 18px 15px; color: #77787d; font: 9px var(--mono); display: flex; justify-content: space-between; gap: 10px; }
    .lap-controls { display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: center; gap: 11px; padding: 14px 18px 12px; border-top: 1px solid var(--line); }
    .lap-step { background: transparent; border: 1px solid #393a3e; border-radius: 3px; padding: 6px 9px; color: #ccc; cursor: pointer; }
    .lap-slider { width: 100%; accent-color: var(--red); }
    .lap-readout { display: flex; justify-content: space-between; gap: 10px; padding: 0 18px 12px; color: #bfc0c2; font-size: 10px; }
    .lap-readout strong { color: var(--text); }
    .race-summary-grid { grid-template-columns: repeat(4,minmax(0,1fr)); }
    .lap-log { max-height: 390px; overflow: auto; margin: 0 -7px; }
    .lap-log .table { min-width: 570px; }
    .lap-log .table th { position: sticky; top: 0; background: var(--panel); z-index: 1; }
    .lap-row { cursor: pointer; }
    .lap-row:hover,.lap-row.selected { background: #ffffff0a; }
    .event-tag { color: var(--amber); font-size: 9px; }
    .event-tag.clear { color: #77787d; }
    .track-note { color: #68696e; font: 9px var(--mono); padding: 0 18px 13px; }
    .live-session-shell .layout { grid-template-columns: minmax(0,1fr); }
    .live-session-shell .sidebar { display: none; }
    .live-session-shell main { max-width: none; padding: 25px 30px 34px; }
    .live-page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 18px; margin-bottom: 16px; }
    .live-page-head h1 { margin-top: 5px; }
    .live-stage { position: relative; height: min(76vh,760px); min-height: 540px; overflow: hidden; border: 1px solid #343539; border-radius: 6px; background: radial-gradient(ellipse at 50% 45%,#202226,#121316 72%); }
    .live-track-svg { position: absolute; top: 50%; left: 59%; width: min(54%,700px); height: min(90%,700px); max-width: 700px; max-height: 700px; transform: translate(-50%,-50%); overflow: visible; }
    .live-track-svg .track-edge { stroke-width: 18; }
    .live-track-svg .track-line { stroke-width: 9; }
    .live-track-svg .track-center { stroke-width: 1.5; }
    .live-track-svg .track-number { font-size: 3px; }
    .track-car-sprite { pointer-events: none; }
    .live-timing-panel,.live-status-panel,.live-control-panel,.live-event-panel { position: absolute; z-index: 2; border: 1px solid #404146; border-radius: 5px; background: #141518ed; box-shadow: 0 8px 30px #0007; backdrop-filter: blur(8px); }
    .live-timing-panel { top: 16px; left: 16px; width: min(325px,calc(100% - 32px)); max-height: calc(100% - 32px); overflow: auto; }
    .live-timing-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 11px 12px; border-bottom: 1px solid #38393d; }
    .live-timing-summary { display: flex; align-items: center; justify-content: space-between; gap: 8px; list-style: none; cursor: pointer; }
    .live-timing-summary::-webkit-details-marker { display: none; }
    .live-timing-summary::after { content: "⌄"; color: var(--amber); font-size: 15px; }
    .live-timing-panel[open] .live-timing-summary::after { content: "⌃"; }
    .live-timing-table-wrap { overflow: auto; }
    .live-timing-title { font: 600 12px var(--display); }
    .live-timing-phase { color: var(--amber); font: 9px var(--mono); }
    .live-table { width: 100%; border-collapse: collapse; }
    .live-table th { padding: 7px 5px; color: #74757a; font: 8px var(--mono); text-align: left; }
    .live-table td { padding: 5px; border-top: 1px solid #292a2d; font: 9px var(--mono); white-space: nowrap; }
    .live-table th:first-child,.live-table td:first-child { width: 26px; padding-left: 11px; }
    .live-table th:last-child,.live-table td:last-child { padding-right: 11px; text-align: right; }
    .live-table tr.live-player-row { background: #ffffff0b; }
    .live-position { color: #86878c; }
    .live-driver { font: 600 10px var(--display) !important; }
    .live-team-label { display: block; margin: 2px 0 0 9px; color: #77787d; font: 8px var(--mono); }
    .live-team-dot { display: inline-block; width: 3px; height: 13px; margin-right: 6px; vertical-align: middle; background: var(--driver-color); }
    .live-gap { color: #a5a6aa; text-align: right; }
    .live-lap-time { color: #d3d4d6; text-align: right; }
    .live-driver-controls { display: flex; align-items: center; gap: 5px; margin: 4px 0 2px 9px; }
    .live-driver-controls select,.live-driver-controls button { min-height: 22px; padding: 3px 5px; border: 1px solid #414247; border-radius: 3px; background: #222326; color: #d6d7d9; font: 8px var(--mono); }
    .live-driver-controls select { max-width: 88px; }
    .live-driver-controls button { color: var(--amber); cursor: pointer; }
    .live-driver-controls button:disabled { opacity: .55; cursor: default; }
    .live-status-panel { top: 16px; right: 16px; min-width: 150px; padding: 11px 13px; text-align: right; }
    .live-status-panel strong { display: block; font: 600 21px var(--display); }
    .live-status-panel span { color: #999a9e; font: 9px var(--mono); }
    .live-status-panel .live-lap-reference { display: block; color: var(--amber); }
    .live-status-panel .live-weather { display: block; margin-top: 3px; color: #b7b8bb; }
    .live-event-panel { bottom: 16px; left: 16px; max-width: min(55%,510px); padding: 10px 13px; color: #d1d2d4; font-size: 10px; }
    .live-event-label { display: block; margin-bottom: 3px; color: var(--amber); font: 9px var(--mono); }
    .live-control-panel { right: 16px; bottom: 16px; display: flex; align-items: center; gap: 7px; padding: 8px; }
    .live-control-panel .btn-small { min-width: 55px; }
    .live-progress { height: 3px; background: #303135; }
    .live-progress i { display: block; height: 100%; background: var(--red); transition: width .2s linear; }
    .live-attribution { margin-top: 9px; color: #65666a; font: 9px var(--mono); text-align: right; }
    .choice-group { margin: 0 0 16px; }
    .choice-label { display: block; color: #aaa; font-size: 10px; margin-bottom: 7px; }
    select {
      width: 100%; background: #222326; color: var(--text); border: 1px solid #393a3e;
      padding: 10px 11px; border-radius: 3px; font-size: 11px;
    }
    .strategy-note { color: #77787d; font-size: 10px; margin-top: 6px; min-height: 15px; }
    .full { grid-column: 1/-1; }
    .driver-cards { grid-template-columns: repeat(2,minmax(0,1fr)); }
    .driver-card { padding: 19px; }
    .driver-card-top { display: flex; justify-content: space-between; align-items: start; }
    .driver-card h3 { font: 600 19px var(--display); margin: 3px 0; }
    .driver-number-large { color: #55565a; font: 12px var(--mono); }
    .driver-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 9px; margin-top: 17px; padding-top: 14px; border-top: 1px solid var(--line); }
    .driver-stat-label { color: #77787d; font: 9px var(--mono); }
    .driver-stat-value { font: 14px var(--display); margin-top: 4px; }
    .upgrade-grid { grid-template-columns: repeat(3,minmax(0,1fr)); }
    .upgrade-card { padding: 18px; display: flex; flex-direction: column; min-height: 179px; }
    .upgrade-icon { font: 18px var(--display); color: var(--team,var(--red)); }
    .upgrade-name { font: 600 14px var(--display); margin-top: 11px; }
    .upgrade-desc { color: #85868a; font-size: 10px; margin-top: 4px; min-height: 31px; }
    .upgrade-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 14px; }
    .upgrade-cost { font: 10px var(--mono); color: #c6c6c9; }
    .progress { height: 4px; background: #303135; border-radius: 9px; overflow: hidden; margin-top: 8px; }
    .progress > i { display: block; height: 100%; background: var(--team,var(--red)); }
    .calendar-row { display: grid; grid-template-columns: 42px minmax(0,1fr) auto auto; align-items: center; gap: 12px; padding: 12px 6px; border-top: 1px solid #292a2d; }
    .calendar-round { font: 10px var(--mono); color: #77787d; }
    .calendar-name { font: 600 12px var(--display); }
    .calendar-location { color: var(--muted); font-size: 10px; }
    .calendar-date { color: #929398; font: 9px var(--mono); text-align: right; }
    .calendar-status { color: #77787d; font: 9px var(--mono); min-width: 55px; text-align: right; }
    .calendar-status.done { color: var(--green); }
    .calendar-status.next { color: var(--red); }
    .empty-note { color: #85868a; font-size: 12px; padding: 20px 4px; }
    .toast { position: fixed; bottom: 20px; right: 20px; z-index: 10; background: #292a2e; border: 1px solid #414247; padding: 12px 16px; border-radius: 4px; color: #eee; font-size: 11px; box-shadow: 0 10px 40px #0007; animation: appear .18s ease-out; }
    @keyframes appear { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .setup {
      min-height: 100vh; padding: 42px 24px 60px;

      function loadCareer() {
        try {
          const saved = localStorage.getItem(getCareerStorageKey());
          if (!saved) return null;
          const parsed = JSON.parse(saved);
          if (!parsed || !teams.some(t => t.id === parsed.teamId) || !Number.isInteger(parsed.raceIndex) ||
              parsed.raceIndex < 0 || parsed.raceIndex > races.length || !Number.isFinite(parsed.money) ||
              !parsed.upgrades || !Array.isArray(parsed.drivers) || !Array.isArray(parsed.constructorStandings) ||
              !Array.isArray(parsed.driverStandings) || !Array.isArray(parsed.results)) return null;
          if(!Number.isInteger(parsed.seasonYear)||parsed.seasonYear<2025)parsed.seasonYear=2025;
          if(!Array.isArray(parsed.seasons))parsed.seasons=[];
          if(!parsed.pendingCelebration||typeof parsed.pendingCelebration!=="object")parsed.pendingCelebration=null;
          const defaultAiTeams=createAiTeams(parsed.teamId);
          const savedAiTeams=parsed.aiTeams&&typeof parsed.aiTeams==="object"?parsed.aiTeams:{};
          parsed.aiTeams=defaultAiTeams;
          teams.filter(team=>team.id!==parsed.teamId).forEach(team=>{
            const savedTeam=savedAiTeams[team.id];
            if(!savedTeam||typeof savedTeam!=="object")return;
            parsed.aiTeams[team.id]={
              base:Number.isFinite(savedTeam.base)?Math.max(60,Math.min(99,savedTeam.base)):defaultAiTeams[team.id].base,
              drivers:team.drivers.map((driver,index)=>{
                const savedDriver=Array.isArray(savedTeam.drivers)?savedTeam.drivers[index]:null;
                return {name:driver[0],number:driver[1],rating:savedDriver&&Number.isFinite(savedDriver.rating)?Math.max(50,Math.min(99,savedDriver.rating)):driver[2]};
              })
            };
          });
          if (!Array.isArray(parsed.freeAgents)) parsed.freeAgents = marketDrivers.map(d => ({ ...d }));
          if (!parsed.weekend || typeof parsed.weekend !== "object") parsed.weekend = null;
          parsed.drivers=parsed.drivers.map(driver=>({
            ...driver,
            potential:Number.isFinite(driver.potential)?driver.potential:Math.min(99,driver.rating+5),
            morale:Number.isFinite(driver.morale)?driver.morale:75,
            trainingSessions:Number.isInteger(driver.trainingSessions)?driver.trainingSessions:0
          }));
          const sponsorDefaults=createSponsor(getTeam(parsed.teamId));
          const savedSponsor=parsed.sponsor&&typeof parsed.sponsor==="object"?parsed.sponsor:{};
          parsed.sponsor={
            ...sponsorDefaults,...savedSponsor,
            name:typeof savedSponsor.name==="string"?savedSponsor.name:sponsorDefaults.name,
            targetPoints:Number.isFinite(savedSponsor.targetPoints)&&savedSponsor.targetPoints>0?savedSponsor.targetPoints:sponsorDefaults.targetPoints,
            reward:Number.isFinite(savedSponsor.reward)&&savedSponsor.reward>=0?savedSponsor.reward:sponsorDefaults.reward,
            installment:Number.isFinite(savedSponsor.installment)&&savedSponsor.installment>=0?savedSponsor.installment:sponsorDefaults.installment,
            paid:typeof savedSponsor.paid==="boolean"?savedSponsor.paid:false
          };
          if (parsed.weekend) {
            if (!Number.isInteger(parsed.weekend.practice)) parsed.weekend.practice=parsed.weekend.grid?3:0;
            parsed.weekend.practice=Math.max(0,Math.min(3,parsed.weekend.practice));
            if (!Array.isArray(parsed.weekend.practiceResults)) parsed.weekend.practiceResults=[];
            parsed.weekend.setup={...defaultSetup,...(parsed.weekend.setup||{})};
            if (!Number.isFinite(parsed.weekend.setupConfidence)) parsed.weekend.setupConfidence=0;
            if (!parsed.weekend.practiceTyre) parsed.weekend.practiceTyre="medium";
          }
          return parsed;
        } catch (error) {
          console.warn("Could not load saved APEX career.", error);
          return null;
        }
      }

      function createAiTeams(playerTeamId) {
        return teams.reduce((rosters,team)=>{

          return rosters;
        },{});

      function createSponsor(team) {
        const tier=team.base>=90?0:team.base>=85?1:team.base>=80?2:3;
        const contracts=[
          {name:"Apex Dynamics",targetPoints:360,reward:20,installment:1.2},
          {name:"Velocity Energy",targetPoints:240,reward:17,installment:1.0},
          {name:"Northstar Systems",targetPoints:120,reward:14,installment:0.8},

        return {...contracts[tier],paid:false};

      function createWeekend(race) {
        return {round:race.round,grid:null,weather:"To be confirmed",practice:0,practiceResults:[],qualifyingResults:null,practiceTyre:"medium",setup:{...defaultSetup},setupConfidence:0};

      function myTeam() { return getTeam(career.teamId); }
      function esc(value) {
        return String(value).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
      }
      function fmtMoney(value) { return `€${Math.max(0,value).toFixed(1)}M`; }
      function percent(value, max) { return Math.min(100, Math.round(value / max * 100)); }
      function nextRace() { return races[career.raceIndex]; }
      function completedSeason() { return career.raceIndex >= races.length; }
      function standings(sortKey="points") {
        return [...career.constructorStandings].sort((a,b) => b[sortKey]-a[sortKey] || compareCountback("constructor",a,b) || a.teamId.localeCompare(b.teamId));
      }
      function driverStandings() {
        return [...career.driverStandings].sort((a,b) => b.points-a.points || compareCountback("driver",a,b) || a.name.localeCompare(b.name));
      }
      function compareCountback(type,a,b) {
        const totals=entry=>{
          const finishes=Array(teams.length*2).fill(0);
          for(const result of career.results) {
            if(!Array.isArray(result.classification)||!Array.isArray(result.field))continue;
            for(const classification of result.classification) {
              if(!Number.isInteger(classification.position))continue;
              const driver=result.field.find(entry=>entry.id===classification.id);
              const matches=driver&&(type==="constructor"?driver.teamId===entry.teamId:driver.name===entry.name);
              if(matches)finishes[classification.position-1]=(finishes[classification.position-1]||0)+1;
            }
          }
          return finishes;
        };
        const aFinishes=totals(a);
        const bFinishes=totals(b);
        for(let position=0;position<aFinishes.length;position++)if(aFinishes[position]!==bFinishes[position])return bFinishes[position]-aFinishes[position];
        return 0;
      }
      function freshDriverStandings() {
        return teams.flatMap(team=>team.id===career.teamId
          ?career.drivers.map(driver=>({name:driver.name,teamId:team.id,points:0,wins:0}))
          :team.drivers.map(driver=>({name:driver[0],teamId:team.id,points:0,wins:0})));
      }
      function championshipStatus(type,entry,ordered) {
        const leader=ordered[0];
        const remaining=Math.max(0,races.length-career.raceIndex);
        const pointsPerRace=type==="constructor"?points[0]+points[1]:points[0];
        const maximum=remaining*pointsPerRace;
        const isLeader=type==="constructor"?entry.teamId===leader.teamId:entry.name===leader.name;
        if(remaining===0)return isLeader?"CHAMPION":"OUT";
        if(isLeader) {
          const second=ordered.find(candidate=>type==="constructor"?candidate.teamId!==entry.teamId:candidate.name!==entry.name);
          return second&&entry.points-second.points>maximum?"CLINCHED":"IN FIGHT";
        }
        return leader.points-entry.points>maximum?"OUT":"IN FIGHT";
      }

        return teams.flatMap(team => {

      function tutorialCompleted() {

      }
      function renderWelcome() {
        app.innerHTML=`<div class="welcome-screen"><section class="welcome-card" aria-labelledby="welcome-title">
          <div class="brand"><div class="brand-mark">A</div><div class="brand-name">APEX<span>.</span></div><div class="season-tag">TEAM MANAGER · 2025</div></div>
          <div class="eyebrow" style="margin-top:37px">YOUR TEAM. YOUR CALL.</div><h1 id="welcome-title">${career?"Welcome back, Team Principal.":"Welcome to APEX."}</h1>
          <p>Sign in with Google or your email and password, or continue as a guest to manage your team and race for the championships.</p>
          <button type="button" class="auth-google" data-auth-action="google" ${!authConfigured||!authReady||authBusy?"disabled":""}>Continue with Google</button>
          <div class="auth-divider"><span>OR USE EMAIL</span></div>
          <form class="auth-form" id="email-auth-form">
            <label for="auth-email">Email address<input id="auth-email" name="email" type="email" autocomplete="email" required placeholder="you@example.com" value="${esc(authEmail)}"></label>
            <label for="auth-password">Password<input id="auth-password" name="password" type="password" autocomplete="${authMode==="signup"?"new-password":"current-password"}" minlength="6" required placeholder="At least 6 characters"></label>
            <button type="submit" id="auth-submit" class="btn-primary" ${!authConfigured||!authReady||authBusy?"disabled":""}>${authBusy?"Please wait…":authMode==="signup"?"Create account":"Sign in with email"}</button>
          </form>
          <div class="auth-links"><button type="button" class="section-link" id="auth-mode-toggle" ${authBusy?"disabled":""}>${authMode==="signup"?"Already registered? Sign in":"Create an account"}</button><button type="button" class="section-link" data-auth-action="reset" ${!authConfigured||!authReady||authBusy?"disabled":""}>Forgot password?</button></div>
          <p class="auth-message" role="status" aria-live="polite">${esc(authMessage||authConfigMessage)}</p>
          <div class="auth-divider"><span>OR</span></div>
          <div class="welcome-actions"><button type="button" class="btn-primary" id="enter-guest" ${!authReady||authBusy?"disabled":""}>${career?"Continue as Guest":"Play as Guest"}</button>
          <button type="button" class="section-link" id="replay-tutorial" ${!authReady||authBusy?"disabled":""}>${career?"Replay the guided tour":"Start with the guided tour"}</button></div>
          <div class="welcome-note">Careers are saved on this device. Signing in does not sync progress between devices.</div>
        </section></div>`;
        app.querySelector("#auth-mode-toggle").addEventListener("click",()=>{
          authEmail=app.querySelector("#auth-email").value.trim();
          authMode=authMode==="signup"?"signin":"signup";
          authMessage="";
          render();
        });
        app.querySelector("#email-auth-form").addEventListener("submit",event=>{
          event.preventDefault();
          const form=new FormData(event.currentTarget);
          authEmail=String(form.get("email")||"").trim();
          window.dispatchEvent(new CustomEvent("apex:auth-request",{detail:{action:authMode,email:authEmail,password:form.get("password")}}));
        });
        app.querySelector("#auth-email").addEventListener("input",event=>{authEmail=event.currentTarget.value;});
        app.querySelectorAll("[data-auth-action]").forEach(button=>button.addEventListener("click",()=>{
          const email=app.querySelector("#auth-email").value.trim();
          if(button.dataset.authAction==="reset"&&!email){authMessage="Enter your email address first, then choose Forgot password.";render();return;}
          authEmail=email;
          window.dispatchEvent(new CustomEvent("apex:auth-request",{detail:{action:button.dataset.authAction,email}}));
        }));
        app.querySelector("#enter-guest").addEventListener("click",()=>{
          welcomeComplete=true;
          if(career) {
            page="overview";
            if(!tutorialCompleted())tutorialStep=0;
          }
          render();
        });
        app.querySelector("#replay-tutorial").addEventListener("click",()=>{
          try { localStorage.removeItem(getTutorialStorageKey()); }
          catch(error) { console.error("Could not reset APEX tutorial status.",error); toast("Tutorial status could not be reset in this browser."); }
          welcomeComplete=true;
          if(career) {
            page="overview";
            tutorialStep=0;
          }
          render();
        });
      }
      function renderTutorial() {
        const step=tutorialSteps[tutorialStep];
        const progress=Math.round((tutorialStep+1)/tutorialSteps.length*100);
        const finalStep=tutorialStep===tutorialSteps.length-1;
        return `<div class="tutorial-backdrop"><section class="tutorial-card" role="dialog" aria-modal="true" aria-labelledby="tutorial-title" aria-describedby="tutorial-copy">
          <div class="eyebrow">GUIDED TOUR · ${tutorialStep+1} OF ${tutorialSteps.length} · ${esc(step.page.toUpperCase())}</div>
          <div class="tutorial-progress" aria-label="Tutorial progress"><i style="width:${progress}%"></i></div>
          <h2 id="tutorial-title">${esc(step.title)}</h2><p id="tutorial-copy">${esc(step.text)}</p>
          <div class="tutorial-actions"><button type="button" class="section-link" data-tutorial-skip>Skip tour</button><div class="tutorial-actions-right">
            <button type="button" class="btn-secondary" data-tutorial-prev ${tutorialStep===0?"disabled":""}>Back</button>
            <button type="button" class="btn-primary" data-tutorial-next>${finalStep?"Finish":"Next"}</button>
          </div></div>
        </section></div>`;
      }
      function bindTutorial() {
        const previous=app.querySelector("[data-tutorial-prev]");
        const next=app.querySelector("[data-tutorial-next]");
        const skip=app.querySelector("[data-tutorial-skip]");
        if(previous)previous.addEventListener("click",()=>moveTutorial(-1));
        if(next)next.addEventListener("click",()=>moveTutorial(1));
        if(skip)skip.addEventListener("click",completeTutorial);
      }
      function moveTutorial(direction) {
        const nextStep=tutorialStep+direction;
        if(nextStep<0)return;
        if(nextStep>=tutorialSteps.length){completeTutorial();return;}
        tutorialStep=nextStep;
        page=tutorialSteps[tutorialStep].page;
        render();
      }
      function completeTutorial() {
        tutorialStep=null;
        try { localStorage.setItem(getTutorialStorageKey(),"complete"); }
        catch(error) { console.error("Could not save APEX tutorial status.",error); toast("Tutorial completion could not be saved in this browser."); }
        render();
      }
      function renderChampionCelebration(celebration) {

          ?`${celebration.constructorName} and ${celebration.driverName} topped both championships.`

            ?`${celebration.constructorName} secured the constructors' title with ${celebration.constructorPoints} points.`
            :`${celebration.driverName} won the drivers' championship with ${celebration.driverPoints} points.`;
        return `<div class="champions-backdrop"><section class="champions-card" role="dialog" aria-modal="true" aria-labelledby="champions-title" aria-describedby="champions-copy">

          <h2 id="champions-title">${title}</h2><p id="champions-copy">${esc(details)}</p>
          <div class="champion-awards">${celebration.constructorWon?`<span class="champion-award">CONSTRUCTORS' WORLD CHAMPIONS</span>`:""}${celebration.driverWon?`<span class="champion-award">DRIVERS' WORLD CHAMPION</span>`:""}</div>
          <button type="button" class="btn-primary" id="continue-after-champions">Continue to the race report</button>

      function dismissChampionCelebration() {

          <div class="setup-head"><div class="eyebrow">YOUR TEAM. YOUR CALL.</div><h1>Build your legacy.</h1><p>Take charge of a real Formula One team. Make the calls, develop the car and fight for both world championships.</p></div>
          <div class="team-grid">${teams.map(team => `<button type="button" class="team-choice ${chosenTeam===team.id?"selected":""}" style="--team:${team.color}" data-team="${team.id}" aria-pressed="${chosenTeam===team.id}">
            <div class="team-bar"></div><div class="team-choice-name">${esc(team.name)}</div>

          <div class="setup-foot">24 ROUNDS · TWO TITLES · ONE TEAM PRINCIPAL</div>

        app.querySelectorAll("[data-team]").forEach(button => button.addEventListener("click", () => {
          chosenTeam = button.dataset.team;

          window.dispatchEvent(new CustomEvent("apex:auth-request",{detail:{action:"signout"}}));
        }));

      function renderPage() {
        switch (page) {
          case "live": return renderLiveSession();
          case "race": return renderRace();
          case "drivers": return renderDrivers();
          case "market": return renderMarket();
          case "development": return renderDevelopment();
          case "standings": return renderStandings();
          case "calendar": return renderCalendar();
          case "report": return renderRaceReport();
          default: return renderOverview();
        }

      function pageHead(title, sub, right="") {
        return `<div class="page-head"><div><div class="eyebrow">${esc(myTeam().name)} · ${career.seasonYear} SEASON</div><h1>${title}</h1><div class="page-sub">${sub}</div></div>${right}</div>`;
      }
      function stat(label, value, note) {
        return `<div class="card stat-card"><div class="stat-label">${label}</div><div class="stat-value">${value}</div><div class="stat-note">${note}</div></div>`;
      }
      function renderSponsorCard() {
        const sponsor=career.sponsor;
        const current=teamPoints(career.teamId);
        const progress=percent(current,sponsor.targetPoints);
        const status=sponsor.paid?"TARGET ACHIEVED":completedSeason()?"TARGET MISSED":"IN PROGRESS";
        return `<section class="card sponsor-card"><div class="section-head"><div><div class="eyebrow">SEASON SPONSOR · ${esc(status)}</div><div class="section-title" style="margin-top:5px">${esc(sponsor.name)}</div></div><div class="session-badge">BONUS · ${fmtMoney(sponsor.reward)}</div></div>
          <div class="page-sub">Score ${sponsor.targetPoints} constructors' points this season to unlock the ${fmtMoney(sponsor.reward)} bonus. The contract pays ${fmtMoney(sponsor.installment)} after each Grand Prix.</div>
          <div class="sponsor-progress"><div class="progress"><i style="width:${progress}%"></i></div><div class="sponsor-total">${current} / ${sponsor.targetPoints} PTS</div></div></section>`;
      }
      function raceHero(race, buttonText, action, disabled=false) {
        return `<div class="card race-hero"><div class="race-top"><div class="race-round">ROUND ${String(race.round).padStart(2,"0")} · ${esc(race.circuit.toUpperCase())}</div><div class="race-name">${esc(race.name)}</div><div class="race-loc">${esc(race.location)} · ${esc(race.circuit)}</div></div>
          <div class="race-bottom"><div class="race-date">${esc(raceDate(race))}</div><button class="btn-primary" data-action="${action}" ${disabled?"disabled":""}>${buttonText} &nbsp;→</button></div></div>`;
      }
      function renderOverview() {
        const race = nextRace();
        const last = career.results[career.results.length-1];
        const wins = career.results.filter(r => r.winnerTeam === career.teamId).length;
        const best = career.results.reduce((n,r) => Math.min(n, r.positions[career.teamId] || 20), 20);
        const head = pageHead("Team overview", completedSeason() ? `${career.seasonYear} season complete. Review the champions, then carry your team into the next year.` : "Every decision moves your team closer to the front.", `<div class="round-pill">${completedSeason()?`${career.seasonYear} SEASON`:"ROUND "+String(career.raceIndex+1).padStart(2,"0")+" / 24"}</div>`);
        const mainRace = race ? raceHero(race,"Prepare for race weekend","open-race") : `<div class="card race-hero"><div class="race-top"><div class="race-round">${career.seasonYear} SEASON</div><div class="race-name">Season complete</div><div class="race-loc">Your car development and driver ratings carry into next season.</div></div><div class="race-bottom"><div class="race-date">24 ROUNDS COMPLETE</div><button class="btn-primary" data-action="advance-season">Start ${career.seasonYear+1} season</button></div></div>`;
        const position = standings().findIndex(r => r.teamId === career.teamId)+1;
        const topTeams = standings().slice(0,4);
        return `${head}<div class="grid stat-grid">${stat("CONSTRUCTORS POSITION",position?`P${position}`:"—",`${career.constructorStandings.find(t=>t.teamId===career.teamId).points} championship points`)}${stat("RACE WINS",wins,`${career.results.length} of 24 rounds completed`)}${stat("BEST FINISH",best===20?"—":`P${best}`,best===20?"First result still to come":"Across this season")}${stat("TEAM BUDGET",fmtMoney(career.money),"Available for car development")}</div>
          <div class="result-banner" id="last-result">${last ? `ROUND ${last.round}: ${esc(last.raceName)} — ${esc(myTeam().name)} finished ${ordinal(last.positions[career.teamId])}. ${esc(last.summary)}` : ""}</div>
          <div class="grid two-col"><section>${mainRace}<div class="card section-card" style="margin-top:14px"><div class="section-head"><div class="section-title">Championship picture</div><button class="section-link" data-page="standings">Full standings →</button></div>${renderConstructorTable(topTeams)}</div></section>
          <section class="card section-card"><div class="section-head"><div class="section-title">Your drivers</div><button class="section-link" data-page="drivers">Driver profiles →</button></div>${renderMyDrivers()}</section></div>${renderSponsorCard()}`;
      }
      function renderMyDrivers() {
        return `<div class="drivers-list">${career.drivers.map((d,i)=>`<div class="driver-row"><div class="driver-number">${String(d.number).padStart(2,"0")}</div><div><div class="driver-name">${esc(d.name)}</div><div class="driver-sub">${d.points} championship pts · ${d.wins} ${d.wins===1?"win":"wins"}</div></div><div class="rating">${d.rating} OVR</div></div>`).join("")}</div>`;
      }
      function renderConstructorTable(rows) {
        const ordered=standings();
        const leader=ordered[0];
        return `<table class="table"><thead><tr><th>POS</th><th>CONSTRUCTOR</th><th>PTS</th><th>STATUS</th></tr></thead><tbody>${rows.map(entry=>{
          const team = getTeam(entry.teamId);
          const status=championshipStatus("constructor",entry,ordered);
          const statusClass=status==="OUT"?"out":status==="CHAMPION"||status==="CLINCHED"?"champion":"";
          const rowClass=entry.teamId===leader.teamId?(statusClass?"champion-row":"title-leader-row"):"";
          return `<tr class="${rowClass}"><td class="rank">${ordered.findIndex(r=>r.teamId===entry.teamId)+1}</td><td class="team-cell"><span style="color:${team.color}">▌</span> ${esc(team.name)}${team.id===career.teamId?' <span class="muted">(YOU)</span>':''}</td><td class="points">${entry.points}</td><td class="title-status ${statusClass}">${status}</td></tr>`;
        }).join("")}</tbody></table>`;
      }
      function renderRace() {
        const race = nextRace();
        if (!race) {
          const teamChampion=standings()[0];
          const driverChampion=driverStandings()[0];
          return `${pageHead("Season finale",`${career.seasonYear} is complete. The standings decide both world titles.`,`<div class="round-pill">24 / 24 ROUNDS</div>`)}
            <div class="grid two-col"><section class="card section-card"><div class="section-head"><div class="section-title">World champions</div><div class="session-badge">${career.seasonYear}</div></div>
              <div class="driver-row"><div class="driver-number">WCC</div><div><div class="driver-name">${esc(getTeam(teamChampion.teamId).name)}</div><div class="driver-sub">Constructors' champion · ${teamChampion.points} points</div></div><div class="rating">CHAMPION</div></div>
              <div class="driver-row"><div class="driver-number">WDC</div><div><div class="driver-name">${esc(driverChampion.name)}</div><div class="driver-sub">${esc(getTeam(driverChampion.teamId).name)} · ${driverChampion.points} points</div></div><div class="rating">CHAMPION</div></div>
              <button class="btn-primary" style="margin-top:16px" data-action="advance-season">Start ${career.seasonYear+1} season</button>
            </section><section class="card section-card"><div class="section-head"><div class="section-title">Season records</div><div class="eyebrow">${career.results.length} RACE WINNERS</div></div>${renderResults()}</section></div>`;

        career.weekend.practiceResults=Array.isArray(career.weekend.practiceResults)?career.weekend.practiceResults:[];
        career.weekend.setup={...defaultSetup,...(career.weekend.setup||{})};
        if(!career.weekend.practiceTyre)career.weekend.practiceTyre="medium";
        const weekend=career.weekend;
        if (weekend.grid) return renderQualifiedWeekend(race,weekend);

      function renderTrackCard(track, showCars=false) {
        const start=track.layout.match(/^M\s*(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)/);
        const startMark=start?`<path class="track-start" d="M${Number(start[1])-8} ${Number(start[2])} L${Number(start[1])+8} ${Number(start[2])}"/>`:"";
        return `<div class="card track-card"><div class="track-head"><div><div class="section-title">${esc(track.circuit)}</div><div class="page-sub">${esc(track.location)} · ${track.laps} laps</div></div><div class="session-badge">2025 LAYOUT · ${esc(track.layoutId||"CIRCUIT")}</div></div>
          <div class="track-wrap"><svg class="track-svg" viewBox="${esc(track.viewBox||"0 0 420 250")}" role="img" aria-label="Circuit layout for ${esc(track.circuit)}"><path class="track-glow" d="${track.layout}"/><path class="track-edge" d="${track.layout}"/><path class="track-line" id="circuit-line" d="${track.layout}"/><path class="track-center" d="${track.layout}"/>${startMark}<g id="track-cars"></g></svg></div>
          <div class="track-legend"><span>START / FINISH</span><span>${showCars?"LIVE CAR POSITIONS · LAP SELECTOR":"REAL CIRCUIT OUTLINE"}</span></div></div>`;
      }
      function renderLiveSession() {
        if(!liveSession)return renderRace();
        const {race,track,kind,title}=liveSession;
        const start=track.layout.match(/^M\s*(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)/);
        const startMark=start?`<path class="track-start" d="M${Number(start[1])-8} ${Number(start[2])} L${Number(start[1])+8} ${Number(start[2])}"/>`:"";
        const timingColumn=kind==="race"?"LAST":"BEST";
        return `<div class="live-page-head"><div><div class="eyebrow">LIVE TIMING · ${esc(kind.toUpperCase())} · ROUND ${race.round}</div><h1>${esc(title)}</h1><div class="page-sub">${esc(race.location)} · ${esc(race.circuit)} · ${career.seasonYear} season</div></div><div class="session-badge">2025 CIRCUIT MAP</div></div>
          <section class="live-stage" aria-label="${esc(title)} live timing and circuit view">
            <svg class="live-track-svg" viewBox="${esc(track.viewBox||"0 0 500 500")}" role="img" aria-label="Live car positions on the ${esc(race.circuit)} layout"><path class="track-glow" d="${track.layout}"/><path class="track-edge" d="${track.layout}"/><path class="track-line" id="live-circuit-line" d="${track.layout}"/><path class="track-center" d="${track.layout}"/>${startMark}<g id="live-track-cars"></g></svg>
            <details class="live-timing-panel" id="live-timing-panel" aria-label="Live timing tower"><summary class="live-timing-head live-timing-summary"><strong class="live-timing-title">LIVE TIMING</strong><span class="live-timing-phase" id="live-timing-phase"></span></summary>
              <div class="live-timing-table-wrap"><table class="live-table"><thead><tr><th>POS</th><th>DRIVER</th><th>GAP</th><th>${timingColumn}</th></tr></thead><tbody id="live-timing-body"></tbody></table></div>
            </details>
            <aside class="live-status-panel"><strong id="live-frame-label"></strong><span id="live-frame-phase"></span><span class="live-lap-reference" id="live-lap-reference"></span><span class="live-weather" id="live-conditions"></span><div class="live-progress"><i id="live-progress-bar"></i></div></aside>
            <div class="live-event-panel" role="status" aria-live="polite"><span class="live-event-label">RACE CONTROL</span><span id="live-event"></span></div>
            <div class="live-control-panel"><button type="button" class="btn-small" data-live-action="pause">Pause</button><button type="button" class="btn-small" data-live-action="speed">1×</button><button type="button" class="btn-small" data-live-action="finish">Finish</button></div>
          </section>
          <div class="live-attribution">Circuit data © Roy Jules · f1-circuits-svg (MIT)</div>`;
      }
      function renderUnqualifiedWeekend(race,weekend) {
        const practiceCount=weekend.practice;
        const action=practiceCount<3?"practice":"qualify";
        const actionLabel=practiceCount<3?`Run FP${practiceCount+1}`:"Run qualifying";
        const sessions=["FP1","FP2","FP3"];
        const sessionRows=sessions.map((session,index)=>{
          const result=weekend.practiceResults[index];
          const status=result?"COMPLETE":index===practiceCount?"NEXT":"UPCOMING";
          return `<div class="driver-row"><div class="driver-number">${session}</div><div><div class="driver-name">${session==="FP2"?"Long-run practice":session==="FP3"?"Final practice":"Free practice"}</div><div class="driver-sub">${result?`${formatLapTime(result.bestLap)} · setup ${result.setupFit}%`:index===0?"Gather setup and tyre data":index===1?"Tune race pace and tyre wear":"Final balance check before qualifying"}</div></div><div class="session-status ${result?"done":index===practiceCount?"next":""}">${status}${result&&Array.isArray(result.laps)?`<button type="button" class="btn-small practice-replay" data-replay-practice="${index}">Replay</button>`:""}</div></div>`;
        }).join("");
        return `${pageHead("Race weekend",`Round ${race.round} · ${esc(race.location)} · ${esc(race.circuit)}`,`<div class="round-pill">${esc(raceDate(race))}</div>`)}
          ${lastResultMarkup()}
          <div class="grid session-grid"><section>${raceHero(race,actionLabel,action)}
            ${renderTrackCard(race)}

        const gaps=values.map((value,index)=>({index,gap:Math.abs(value-profile[index]),target:profile[index],value}));
        const biggest=gaps.sort((a,b)=>b.gap-a.gap)[0];
        const fit=setupFit(race,setup);
        if(fit>=88)return "The car is in a strong window for this circuit. Both drivers can attack the lap.";
        if(fit>=74)return `A workable balance. ${labels[biggest.index]} is the main opportunity; target roughly ${biggest.target}.`;

      function drawTrackCars(path,group,field,order,progress={}) {
        const totalLength=path.getTotalLength();
        const drivers=new Map(field.map(driver=>[driver.id,driver]));
        let markers=trackMarkerCache.get(group);
        if(!markers) {
          markers=new Map();
          trackMarkerCache.set(group,markers);
        }
        const svgNamespace="http://www.w3.org/2000/svg";
        const activeIds=new Set(order);
        order.forEach((id,index)=>{
          const driver=drivers.get(id);
          if(!driver)return;
          const sprite=teamCarSprites[driver.teamId];
          if(!sprite)throw new Error(`Missing car sprite for team ${driver.teamId}.`);
          const fraction=Number.isFinite(progress[id])?Math.max(0,Math.min(1,progress[id])):index/order.length;
          const distance=totalLength*fraction;
          const sample=Math.min(2,totalLength*0.002);
          const before=path.getPointAtLength((distance-sample+totalLength)%totalLength);
          const after=path.getPointAtLength((distance+sample)%totalLength);
          const point=path.getPointAtLength(distance);
          const angle=Math.atan2(after.y-before.y,after.x-before.x)*180/Math.PI;
          let marker=markers.get(id);
          if(!marker) {
            marker=document.createElementNS(svgNamespace,"g");
            marker.setAttribute("class","track-car-marker");
            const car=document.createElementNS(svgNamespace,"image");
            car.setAttribute("class","track-car-sprite");
            car.setAttribute("x","-4");
            car.setAttribute("y","-8");
            car.setAttribute("width","8");
            car.setAttribute("height","16");
            car.setAttribute("preserveAspectRatio","xMidYMid meet");
            marker.appendChild(car);
            const number=document.createElementNS(svgNamespace,"text");
            number.setAttribute("class","track-number");
            number.setAttribute("x","0");
            number.setAttribute("y","1");
            marker.appendChild(number);
            markers.set(id,marker);
            group.appendChild(marker);
          }
          marker.setAttribute("transform",`translate(${point.x.toFixed(2)} ${point.y.toFixed(2)}) rotate(${(angle+90).toFixed(1)})`);
          const driverPosition=String(index+1);
          const driverLabel=`P${driverPosition} · ${driver.name} · ${driver.teamName}`;
          if(marker.getAttribute("data-driver-id")!==id)marker.setAttribute("data-driver-id",id);
          if(marker.getAttribute("data-position")!==driverPosition)marker.setAttribute("data-position",driverPosition);
          if(marker.getAttribute("aria-label")!==driverLabel)marker.setAttribute("aria-label",driverLabel);
          let markerTitle=marker.querySelector("title");
          if(!markerTitle) {
            markerTitle=document.createElementNS(svgNamespace,"title");
            marker.insertBefore(markerTitle,marker.firstChild);
          }
          if(markerTitle.textContent!==driverLabel)markerTitle.textContent=driverLabel;
          const carImage=marker.querySelector(".track-car-sprite");
          if(carImage.getAttribute("href")!==sprite)carImage.setAttribute("href",sprite);
          marker.querySelector(".track-number").textContent=String(driver.number);
        });

            marker.remove();
            markers.delete(id);
          }
        }
      }
      function makeTimingFrame(race,field,options) {
        const order=[...options.order];
        const metrics=options.metricById;
        const leaderMetric=metrics[order[0]]||0;
        const gaps={};
        const lapsBehind={};
        const progress={};
        for(const entry of field) {
          const gap=Math.max(0,(metrics[entry.id]??leaderMetric)-leaderMetric);
          const behind=Math.floor(gap/race.lapSeconds);
          gaps[entry.id]=gap;
          lapsBehind[entry.id]=behind;
          if(entry.retired&&Number.isFinite(entry.lastProgress)) {
            progress[entry.id]=entry.lastProgress;
          } else {
            progress[entry.id]=((options.lap-gap/race.lapSeconds)%1+1)%1;
            entry.lastProgress=progress[entry.id];
          }
        }
        return {
          lap:options.lap,phase:options.phase||"",order,gaps,lapsBehind,progress,metrics:{...metrics},
          lapTimes:options.lapTimes||{},bestTimes:options.bestTimes||{},
          tyres:options.tyres||{},status:options.status||{},event:options.event||"Green flag running",
          condition:options.condition||"Dry",safetyCar:Boolean(options.safetyCar)
        };
      }
      function recalculateTimingFrame(frame,race,field) {
        const metrics=frame.metrics;
        const order=[...field].sort((a,b)=>{
          const aRetired=frame.status[a.id]==="DNF"?1:0;
          const bRetired=frame.status[b.id]==="DNF"?1:0;
          return aRetired-bRetired||(metrics[a.id]??Infinity)-(metrics[b.id]??Infinity);
        }).map(entry=>entry.id);
        const leaderMetric=metrics[order[0]]||0;
        frame.order=order;
        for(const entry of field) {
          const gap=Math.max(0,(metrics[entry.id]??leaderMetric)-leaderMetric);
          frame.gaps[entry.id]=gap;
          frame.lapsBehind[entry.id]=Math.floor(gap/race.lapSeconds);
          frame.progress[entry.id]=((frame.lap-gap/race.lapSeconds)%1+1)%1;
        }
      }

            if(!driver)return "";
            const gap=frame.gaps[id]||0;
            const gapText=index===0?"LEADER":frame.lapsBehind[id]>0?`+${frame.lapsBehind[id]} LAP`:`+${gap.toFixed(3)}`;
            const time=kind==="race"?frame.lapTimes[id]:frame.bestTimes[id];
            const status=Object.prototype.hasOwnProperty.call(statuses,id)?(statuses[id]||driver.teamName):(driver.retired?"DNF":driver.teamName);
            const control=kind==="race"&&driver.teamId===career.teamId?liveSession.driverControls[driver.id]:null;
            const controlMarkup=control?`<div class="live-driver-controls"><select data-pace-car="${esc(driver.id)}" aria-label="${esc(driver.name)} race pace"><option value="push" ${control.pace==="push"?"selected":""}>Push</option><option value="balanced" ${control.pace==="balanced"?"selected":""}>Balanced</option><option value="conserve" ${control.pace==="conserve"?"selected":""}>Conserve</option></select><button type="button" data-pit-car="${esc(driver.id)}" ${control.pitPending?"disabled":""}>${control.pitPending?(liveSession.current>=control.pitIndex?"IN PIT":"PIT CALLED"):"PIT NEXT LAP"}</button></div>`:"";
            return `<tr data-driver-id="${esc(id)}" data-position="${index+1}" class="${driver.teamId===career.teamId?"live-player-row":""}"><td class="live-position">${String(index+1).padStart(2,"0")}</td><td class="live-driver" aria-label="${esc(driver.name)} · ${esc(status)}"><span class="live-team-dot" style="--driver-color:${driver.teamColor}"></span><span class="live-driver-abbr" title="${esc(driver.name)}">${shortDriverName(driver.name)}</span><small class="live-team-label">${esc(status)}</small>${controlMarkup}</td><td class="live-gap">${gapText}</td><td class="live-lap-time">${Number.isFinite(time)?formatLapTime(time):"—"}</td></tr>`;
          }).join("");
          liveSession.renderedIndex=liveSession.current;
        }
        const path=app.querySelector("#live-circuit-line");
        const group=app.querySelector("#live-track-cars");
        if(path&&group) {
          const progress={};
          for(const driver of field) {
            const start=frame.progress[driver.id]??0;
            const gapChange=(nextFrame.gaps[driver.id]??0)-(frame.gaps[driver.id]??0);
            progress[driver.id]=frame.status[driver.id]==="DNF"
              ?start
              :((start+animationProgress*(1-gapChange/race.lapSeconds))%1+1)%1;
          }
          drawTrackCars(path,group,field,frame.order,progress);
        }
        const pauseButton=app.querySelector('[data-live-action="pause"]');
        const speedButton=app.querySelector('[data-live-action="speed"]');
        if(pauseButton)pauseButton.textContent=liveSession.paused?"Resume":"Pause";
        if(speedButton)speedButton.textContent=`${liveSession.speed}×`;
      }
      function scheduleLiveSession() {
        cancelAnimationFrame(liveTimer);
        if(!liveSession||liveSession.paused)return;
        liveSession.frameDuration=liveSession.race.lapSeconds*1000/liveSession.speed;
        liveSession.frameStartedAt=performance.now()-liveSession.animationProgress*liveSession.frameDuration;
        liveTimer=requestAnimationFrame(advanceLiveSession);
      }
      function advanceLiveSession(now) {
        if(!liveSession||liveSession.paused)return;
        const progress=Math.min(1,(now-liveSession.frameStartedAt)/liveSession.frameDuration);
        liveSession.animationProgress=progress;
        refreshLiveSessionView();
        if(progress>=1) {
          if(liveSession.current>=liveSession.laps.length-1) {
            finishLiveSession();
            return;
          }
          liveSession.current++;
          liveSession.animationProgress=0;
          liveSession.frameStartedAt=now;
          for(const control of Object.values(liveSession.driverControls||{})) {
            if(control.pitPending&&liveSession.current>control.pitIndex)control.pitPending=false;
          }
          refreshLiveSessionView();
        }
        liveTimer=requestAnimationFrame(advanceLiveSession);
      }
      function startLiveSession(session) {
        if(!Array.isArray(session.laps)||!session.laps.length)throw new Error(`Cannot start an empty ${session.kind} session.`);
        cancelAnimationFrame(liveTimer);
        liveSession={...session,current:0,paused:false,speed:1,animationProgress:0,timeAdjustments:{},extraPitStops:0,renderedIndex:-1};
        if(session.kind==="race") {
          liveSession.driverControls=Object.fromEntries(session.field.filter(entry=>entry.teamId===career.teamId).map(entry=>[entry.id,{pace:strategy.pace,pitPending:false}]));
        }
        page="live";
        scheduleLiveSession();
      }
      function replayPracticeSession(index) {
        const race=nextRace();
        const result=career.weekend&&career.weekend.practiceResults[index];
        if(!race||!result||!Array.isArray(result.laps)||!Array.isArray(result.field))return;
        startLiveSession({
          kind:"practice",practice:result.session,title:`Free Practice ${result.session} · Replay`,
          race,track:race,field:result.field,laps:result.laps,weather:result.weather||"Dry",
          onFinish:()=>{page="race";toast(`FP${result.session} replay complete.`);}
        });
      }
      function replayQualifyingSession() {
        const race=nextRace();
        const result=career.weekend&&career.weekend.qualifyingResults;
        if(!race||!result||!Array.isArray(result.laps)||!Array.isArray(result.field))return;
        startLiveSession({
          kind:"qualifying",title:"Qualifying · Replay",race,track:race,field:result.field,laps:result.laps,weather:result.weather||"Dry",
          onFinish:()=>{page="race";toast("Qualifying replay complete.");}
        });
      }
      function finishLiveSession() {
        if(!liveSession)return;
        cancelAnimationFrame(liveTimer);
        liveTimer=null;
        const completedSession=liveSession;
        if(completedSession.kind==="race") {
          for(const entry of completedSession.field)entry.time+=completedSession.timeAdjustments[entry.id]||0;
          for(const entry of completedSession.field) {
            const control=completedSession.driverControls[entry.id];
            if(control&&control.pitCount)entry.pitCount=(entry.pitCount||0)+control.pitCount;
          }
        }
        const complete=completedSession.onFinish;
        liveSession=null;
        if(complete)complete(completedSession);
        render();
      }
      function handleLiveAction(action,button) {
        if(!liveSession)return;
        if(action==="pause") {
          liveSession.paused=!liveSession.paused;
          if(liveSession.paused)cancelAnimationFrame(liveTimer);
          else scheduleLiveSession();
          button.textContent=liveSession.paused?"Resume":"Pause";
          return;
        }
        if(action==="speed") {
          const speeds=[1,2,4,8,16,32,64];
          liveSession.speed=speeds[(speeds.indexOf(liveSession.speed)+1)%speeds.length];
          button.textContent=`${liveSession.speed}×`;
          const lapReference=app.querySelector("#live-lap-reference");
          if(lapReference)lapReference.textContent=`${liveSession.speed}× lap · ${formatLapTime(liveSession.race.lapSeconds/liveSession.speed)}`;
          scheduleLiveSession();
          return;
        }
        if(action==="finish") {
          liveSession.current=liveSession.laps.length-1;
          liveSession.animationProgress=1;
          refreshLiveSessionView(true);
          finishLiveSession();
        }
      }
      function bindLiveTimingControls() {
        const panel=app.querySelector("#live-timing-panel");
        if(!panel)return;
        panel.addEventListener("change",event=>{
          const paceSelect=event.target.closest("[data-pace-car]");
          if(paceSelect)setRacePace(paceSelect.dataset.paceCar,paceSelect.value);
        });
        panel.addEventListener("click",event=>{

          if(pitButton)callRacePitStop(pitButton.dataset.pitCar);
        });

      function setRacePace(driverId,pace) {
        if(!liveSession||liveSession.kind!=="race"||!["push","balanced","conserve"].includes(pace))return;
        const control=liveSession.driverControls[driverId];
        const driver=liveSession.field.find(entry=>entry.id===driverId&&entry.teamId===career.teamId);
        if(!control||!driver||control.pace===pace)return;
        const adjustment={push:-0.18,balanced:0,conserve:0.2};
        const delta=adjustment[pace]-adjustment[control.pace];
        const firstFutureIndex=liveSession.current+1;
        let adjustedLaps=0;
        for(let index=firstFutureIndex;index<liveSession.laps.length;index++) {
          const frame=liveSession.laps[index];
          frame.metrics[driverId]=(frame.metrics[driverId]||0)+delta*(index-liveSession.current);
          frame.lapTimes[driverId]=(frame.lapTimes[driverId]||0)+delta;
          adjustedLaps++;
          recalculateTimingFrame(frame,liveSession.race,liveSession.field);
        }
        liveSession.timeAdjustments[driverId]=(liveSession.timeAdjustments[driverId]||0)+delta*adjustedLaps;
        control.pace=pace;
        const nextFrame=liveSession.laps[firstFutureIndex];
        if(nextFrame)nextFrame.event+=` · ${driver.name} switched to ${pace} pace`;
        liveSession.renderedIndex=-1;
        refreshLiveSessionView(true);
      }
      function callRacePitStop(driverId) {
        if(!liveSession||liveSession.kind!=="race")return;
        const control=liveSession.driverControls[driverId];
        const driver=liveSession.field.find(entry=>entry.id===driverId&&entry.teamId===career.teamId);
        if(!control||!driver||control.pitPending)return;
        const pitIndex=liveSession.current+1;
        if(pitIndex>=liveSession.laps.length) {
          toast("There is no racing lap left for a pit stop.");
          return;
        }
        control.pitPending=true;
        control.pitIndex=pitIndex;
        control.pitCount=(control.pitCount||0)+1;
        liveSession.extraPitStops++;
        const pitFrame=liveSession.laps[pitIndex];
        const pitLoss=(pitFrame.safetyCar?14.1:21.4)-career.upgrades.operations*0.45;
        liveSession.timeAdjustments[driverId]=(liveSession.timeAdjustments[driverId]||0)+pitLoss;
        for(let index=pitIndex;index<liveSession.laps.length;index++) {
          const frame=liveSession.laps[index];
          frame.metrics[driverId]=(frame.metrics[driverId]||0)+pitLoss;
          frame.tyres[driverId]=frame.condition==="Damp"?"intermediate":"medium";
          if(index===pitIndex)frame.lapTimes[driverId]=(frame.lapTimes[driverId]||0)+pitLoss;
          recalculateTimingFrame(frame,liveSession.race,liveSession.field);
        }
        pitFrame.event+=` · ${driver.name} pits for fresh tyres`;
        liveSession.renderedIndex=-1;
        refreshLiveSessionView(true);
      }

      function toast(message) {
        const existing = document.querySelector(".toast");
        if (existing) existing.remove();
        const item = document.createElement("div");
        item.className = "toast";
        item.setAttribute("role","status");
        item.textContent = message;
        document.body.appendChild(item);
        setTimeout(() => item.remove(), 2800);
      }
      function ordinal(n) {
        const suffix = n%100>=11&&n%100<=13?"th":({1:"st",2:"nd",3:"rd"}[n%10]||"th");
        return `${n}${suffix}`;
      }
      function buyUpgrade(id) {
        const upgrade = upgrades.find(u=>u.id===id);
        if (!upgrade) return;
        const cost = +(upgrade.cost + career.upgrades[id]*5).toFixed(1);
        if (career.money < cost) { toast("Not enough budget for this development."); return; }
        career.money = +(career.money-cost).toFixed(1);
        career.upgrades[id]++;
        save();
        render();
        toast(`${upgrade.name} upgraded to level ${career.upgrades[id]}.`);
      }
      function trainDriver(name) {
        const driver=career.drivers.find(entry=>entry.name===name);
        const fee=3;
        if(!driver||completedSeason()||driver.rating>=driver.potential||driver.trainingSessions>=5)return;
        if(career.money<fee){toast("Your budget cannot cover another driver training session.");return;}
        career.money=+(career.money-fee).toFixed(1);
        driver.rating=Math.min(driver.potential,driver.rating+1);
        driver.morale=Math.min(100,driver.morale+3);
        driver.trainingSessions++;
        save();
        render();
        toast(`${driver.name} completed training and improved to ${driver.rating} rating.`);
      }
      function signDriver(name) {
        const prospect=career.freeAgents.find(driver=>driver.name===name);
        const seat=Number(marketSeat);
        if (!prospect || !Number.isInteger(seat) || seat<0 || seat>1) return;
        if (career.drivers.some(driver=>driver.name===prospect.name)) { toast("That driver already has a seat at your team."); return; }
        const fee=marketFee(prospect);
        if (career.money<fee) { toast("Your budget cannot cover this driver's signing fee."); return; }
        const released=career.drivers[seat];
        career.money=+(career.money-fee).toFixed(1);
        career.freeAgents=career.freeAgents.filter(driver=>driver.name!==prospect.name);
        career.freeAgents.push({name:released.name,number:released.number,rating:released.rating,potential:released.potential,role:"Available after a seat change"});
        career.drivers[seat]={
          name:prospect.name,number:prospect.number,rating:prospect.rating,potential:prospect.potential||Math.min(99,prospect.rating+5),
          morale:72,trainingSessions:0,points:0,wins:0,podiums:0
        };
        if(career.weekend&&nextRace())career.weekend=createWeekend(nextRace());
        addDriverStanding(career.drivers[seat]);
        save();
        render();
        toast(`${prospect.name} signed for Car ${seat+1}.`);
      }
